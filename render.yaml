services:
  - type: web
    name: srm-result-analysis-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        value: https://srm-result-analysis.vercel.app
      # Set these in the Render dashboard — do NOT hardcode secrets here:
      # DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD, DB_SSL_CA, SECRET_KEY
